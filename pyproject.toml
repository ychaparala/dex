[project]
name = "dex-cli"
version = "0.1.0"
description = "Plain-English requests in, ready-to-edit data engineering shell commands out, from a tiny local model."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# The CLI itself is standard library only. xllamacpp runs the model in process; the model
# file comes from the dex-model package (see docs/architecture.md).
dependencies = [
    "xllamacpp>=2026.11.12361",
]
keywords = ["cli", "shell", "data-engineering", "llm", "llama.cpp", "duckdb", "snowflake", "databricks", "aws"]
classifiers = [
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Utilities",
]

[project.optional-dependencies]
# Dataset generation (training/nl2sh.py needs PyYAML) and LoRA fine-tuning. Heavy, so kept
# out of the CLI install.
train = [
  "pyyaml>=6.0.4",
  "torch>=2.15.0",
  "transformers>=5.24.1",
  "datasets>=5.2.0",
  "peft>=0.22.0",
  "trl>=1.19.0",
  "accelerate>=1.16.0",
]

[project.scripts]
dex = "dex.cli:main"

[project.urls]
Homepage = "https://github.com/ychaparala/dex"
Documentation = "https://github.com/ychaparala/dex/tree/main/docs"
Issues = "https://github.com/ychaparala/dex/issues"

[dependency-groups]
dev = [
  "pytest>=9.2.0",
  "pytest-cov>=7.1.0",
  "ruff>=0.17.6",
  "mypy>=2.4.1",
  "pre-commit>=4.7.0",
  "bandit[toml]>=1.9.4",
]

[build-system]
requires = ["uv_build>=0.13.10,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "dex"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "--cov=dex", "--cov-report=term-missing"]

[tool.coverage.run]
branch = true
source = ["dex"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]
warn_unreachable = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# The training-data generator is maintained with its own conventions (see training/README.md).
extend-exclude = ["training/nl2sh.py"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "B",        # bugbear
  "UP",       # pyupgrade
  "SIM",      # simplify
  "N",        # pep8-naming
  "D",        # pydocstyle
  "RUF",      # ruff-specific
  "PTH",      # prefer pathlib
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]  # docstrings are optional in tests
# These run on every request; importing pathlib would cost several milliseconds each time.
"src/dex/{cli,client,context,engine,install}.py" = ["PTH"]

# Security checks come from bandit, not ruff's S rules, so there is one source of truth.
[tool.bandit]
exclude_dirs = ["tests", ".venv", "training"]
