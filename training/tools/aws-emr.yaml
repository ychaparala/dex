      - {name: ROLE_ARN, default: <execution-role-arn>, samples: ["arn:aws:iam::123456789012:role/EMRServerlessJobRole", "arn:aws:iam::123456789012:role/emr-serverless-etl"]}
      - {name: SCRIPT, default: s3://<bucket>/jobs/etl.py, samples: [s3://acme-data/jobs/daily_etl.py, s3://analytics-code/spark/sessionize.py]}
    body: aws emr-serverless start-job-run --application-id "$APP_ID" --execution-role-arn "$ROLE_ARN" --job-driver "{\"sparkSubmit\":{\"entryPoint\":\"$SCRIPT\"}}"
    destructive: false
    source: https://github.com/boto/botocore/tree/develop/botocore/data/emr-serverless
    verified: help

