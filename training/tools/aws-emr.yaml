tool: aws-emr
binaries: [aws]
category: compute
priority: core
target_pairs: 440
version_note: "AWS CLI v2 (aws emr / aws emr-serverless); EMR on EC2 release labels emr-6.x/emr-7.x"
sources:
  - url: https://github.com/aws/aws-cli/blob/v2/awscli/customizations/emr/addsteps.py
    license: "Apache-2.0 (aws/aws-cli repo)"
  - url: https://github.com/aws/aws-cli/blob/v2/awscli/customizations/emr/steputils.py
    license: "Apache-2.0 (aws/aws-cli repo)"
  - url: https://github.com/aws/aws-cli/blob/v2/awscli/customizations/emr/createcluster.py
    license: "Apache-2.0 (aws/aws-cli repo)"
  - url: https://github.com/aws/aws-cli/blob/v2/awscli/customizations/emr/emr.py
    license: "Apache-2.0 (aws/aws-cli repo)"
  - url: https://github.com/aws/aws-cli/blob/v2/awscli/customizations/emr/describecluster.py
    license: "Apache-2.0 (aws/aws-cli repo)"
  - url: https://github.com/aws/aws-cli/blob/v2/awscli/customizations/emr/modifyclusterattributes.py
    license: "Apache-2.0 (aws/aws-cli repo)"
  - url: https://github.com/aws/aws-cli/blob/v2/awscli/customizations/emr/ssh.py
    license: "Apache-2.0 (aws/aws-cli repo)"
  - url: https://github.com/aws/aws-cli/blob/v2/awscli/customizations/removals.py
    license: "Apache-2.0 (aws/aws-cli repo)"
  - url: https://github.com/boto/botocore/tree/develop/botocore/data/emr
    license: "Apache-2.0 (boto/botocore repo)"
  - url: https://github.com/boto/botocore/tree/develop/botocore/data/emr-serverless
    license: "Apache-2.0 (boto/botocore repo)"
  - url: https://awscli.amazonaws.com/v2/documentation/api/latest/reference/emr/index.html
    license: "vendor docs; facts only"
destructive_patterns:
  - '\bterminate-clusters\b'
  - '\bcancel-steps\b'
  - '\bcancel-job-run\b'
  - '\bdelete-application\b'
templates:
  # ---------------- steps: submit ----------------
  - id: aws-emr.steps.add-spark
    group: steps
    intents:
      - submit a spark step to emr cluster {CLUSTER_ID}
      - submit a step running {SCRIPT} on my emr cluster
      - add a pyspark job as an emr step
      - run my spark script on emr in cluster mode
      - emr add-steps spark {SCRIPT}
      - kick off a spark step on the cluster
    vars:
      - {name: CLUSTER_ID, default: <cluster-id>, samples: [j-2AXK7Q1ZB3TQ9, j-1K48ZPLW9HCBT, j-3UN6WX5RRO2AG], ctx: emr_cluster}
      - {name: SCRIPT, default: s3://<bucket>/jobs/etl.py, samples: [s3://acme-data/jobs/daily_etl.py, s3://analytics-code/spark/sessionize.py, s3://etl-artifacts/pyspark/load_orders.py]}
      - {name: STEP_NAME, default: spark-step, samples: [daily-etl, sessionize, load-orders]}
    body: aws emr add-steps --cluster-id "$CLUSTER_ID" --steps "Type=Spark,Name=$STEP_NAME,ActionOnFailure=CONTINUE,Args=[--deploy-mode,cluster,$SCRIPT]"
    destructive: false
    source: https://github.com/aws/aws-cli/blob/v2/awscli/customizations/emr/steputils.py
    verified: source

  - id: aws-emr.steps.add-spark-profile
    group: steps
    intents:
      - submit a spark step to {CLUSTER_ID} using profile {PROFILE} in {REGION}
      - add a spark step with a specific aws profile and region
      - run {SCRIPT} on emr with my {PROFILE} credentials
      - submit spark job to emr in {REGION}
      - push a spark step to the cluster under another account profile
    vars:
      - {name: CLUSTER_ID, default: <cluster-id>, samples: [j-2AXK7Q1ZB3TQ9, j-1K48ZPLW9HCBT, j-3UN6WX5RRO2AG], ctx: emr_cluster}
      - {name: SCRIPT, default: s3://<bucket>/jobs/etl.py, samples: [s3://acme-data/jobs/daily_etl.py, s3://analytics-code/spark/dedupe.py]}
      - {name: PROFILE, default: default, samples: [data-prod, analytics-dev, etl], ctx: aws_profile}
      - {name: REGION, default: us-east-1, samples: [us-west-2, eu-west-1, ap-southeast-2], ctx: aws_region}
    body: aws emr add-steps --cluster-id "$CLUSTER_ID" --steps "Type=Spark,Name=spark-step,ActionOnFailure=CONTINUE,Args=[--deploy-mode,cluster,$SCRIPT]" --profile "$PROFILE" --region "$REGION"
    destructive: false
    source: https://github.com/aws/aws-cli/blob/v2/awscli/customizations/emr/steputils.py
    verified: source

  - id: aws-emr.steps.add-spark-conf
    group: steps
    intents:
      - submit a spark step with {EXEC_MEM} executor memory
      - add an emr spark step and set spark.executor.memory
      - run spark on emr with bigger executors
      - spark step with a custom executor memory conf on {CLUSTER_ID}
      - emr step with spark conf override
    vars:
      - {name: CLUSTER_ID, default: <cluster-id>, samples: [j-2AXK7Q1ZB3TQ9, j-1K48ZPLW9HCBT], ctx: emr_cluster}
      - {name: SCRIPT, default: s3://<bucket>/jobs/etl.py, samples: [s3://acme-data/jobs/aggregate.py, s3://analytics-code/spark/backfill.py]}
      - {name: EXEC_MEM, default: 4g, samples: [8g, 16g, 2g]}
    body: aws emr add-steps --cluster-id "$CLUSTER_ID" --steps "Type=Spark,Name=spark-step,ActionOnFailure=CONTINUE,Args=[--deploy-mode,cluster,--conf,spark.executor.memory=$EXEC_MEM,$SCRIPT]"
    destructive: false
    source: https://github.com/aws/aws-cli/blob/v2/awscli/customizations/emr/steputils.py
    verified: source

  - id: aws-emr.steps.add-spark-args
    group: steps
    intents:
      - submit a spark step and pass {RUN_DATE} as an argument to the script
      - run my emr spark job for date {RUN_DATE}
      - add spark step with script arguments
      - backfill one day with a spark step on emr
      - submit pyspark step with a --date parameter
    vars:
      - {name: CLUSTER_ID, default: <cluster-id>, samples: [j-2AXK7Q1ZB3TQ9, j-3UN6WX5RRO2AG], ctx: emr_cluster}
      - {name: SCRIPT, default: s3://<bucket>/jobs/etl.py, samples: [s3://acme-data/jobs/daily_etl.py, s3://etl-artifacts/pyspark/load_orders.py]}
      - {name: RUN_DATE, default: 2025-01-01, samples: [2025-06-30, 2024-12-31, 2025-03-15]}
    body: aws emr add-steps --cluster-id "$CLUSTER_ID" --steps "Type=Spark,Name=spark-step,ActionOnFailure=CONTINUE,Args=[--deploy-mode,cluster,$SCRIPT,--date,$RUN_DATE]"
    destructive: false
    source: https://github.com/aws/aws-cli/blob/v2/awscli/customizations/emr/steputils.py
    verified: source

  - id: aws-emr.steps.add-spark-class
    group: steps
    intents:
      - submit a scala spark jar {JAR} with main class {MAIN_CLASS}
      - run a spark jar as an emr step
      - add a spark step with --class
      - emr spark-submit a jar with a main class
      - launch my compiled spark app on the cluster
    vars:
      - {name: CLUSTER_ID, default: <cluster-id>, samples: [j-2AXK7Q1ZB3TQ9, j-1K48ZPLW9HCBT], ctx: emr_cluster}
      - {name: MAIN_CLASS, default: com.example.Main, samples: [com.acme.etl.DailyJob, org.example.Sessionize]}
      - {name: JAR, default: s3://<bucket>/jars/app.jar, samples: [s3://acme-data/jars/etl-assembly-1.4.jar, s3://etl-artifacts/jars/sessionize.jar]}
    body: aws emr add-steps --cluster-id "$CLUSTER_ID" --steps "Type=Spark,Name=spark-jar,ActionOnFailure=CONTINUE,Args=[--deploy-mode,cluster,--class,$MAIN_CLASS,$JAR]"
    destructive: false
    source: https://github.com/aws/aws-cli/blob/v2/awscli/customizations/emr/steputils.py
    verified: source

  - id: aws-emr.steps.add-command-runner-spark
    group: steps
    intents:
      - submit spark-submit through command-runner.jar on {CLUSTER_ID}
      - add a custom jar step that calls spark-submit
      - run spark-submit via command-runner
      - emr step using command-runner.jar for {SCRIPT}
      - submit a step with command-runner and spark-submit
    vars:
      - {name: CLUSTER_ID, default: <cluster-id>, samples: [j-2AXK7Q1ZB3TQ9, j-3UN6WX5RRO2AG], ctx: emr_cluster}
      - {name: SCRIPT, default: s3://<bucket>/jobs/etl.py, samples: [s3://acme-data/jobs/daily_etl.py, s3://analytics-code/spark/sessionize.py]}
      - {name: STEP_NAME, default: spark-submit, samples: [nightly-load, compaction]}
    body: aws emr add-steps --cluster-id "$CLUSTER_ID" --steps "Type=CUSTOM_JAR,Name=$STEP_NAME,Jar=command-runner.jar,ActionOnFailure=CONTINUE,Args=[spark-submit,--deploy-mode,cluster,$SCRIPT]"
    destructive: false
    source: https://github.com/aws/aws-cli/blob/v2/awscli/customizations/emr/steputils.py
    verified: source

  - id: aws-emr.steps.add-hive
    group: steps
    intents:
      - run hive script {SCRIPT} as an emr step
      - submit a hive step to cluster {CLUSTER_ID}
      - add a hive query file step
      - execute an hql file on emr
      - emr hive step from s3
    vars:
      - {name: CLUSTER_ID, default: <cluster-id>, samples: [j-2AXK7Q1ZB3TQ9, j-1K48ZPLW9HCBT], ctx: emr_cluster}
      - {name: SCRIPT, default: s3://<bucket>/hive/query.q, samples: [s3://acme-data/hive/daily_rollup.q, s3://analytics-code/hive/repair_partitions.hql]}
    body: aws emr add-steps --cluster-id "$CLUSTER_ID" --steps "Type=Hive,Name=hive-step,ActionOnFailure=CONTINUE,Args=[-f,$SCRIPT]"
    destructive: false
    source: https://github.com/aws/aws-cli/blob/v2/awscli/customizations/emr/steputils.py
    verified: source

  - id: aws-emr.steps.add-custom-jar
    group: steps
    intents:
      - add a custom jar step {JAR} to the cluster
      - run my own jar as an emr step
      - submit a hadoop jar step with an argument
      - emr custom_jar step
      - run {JAR} on emr with input {ARG}
    vars:
      - {name: CLUSTER_ID, default: <cluster-id>, samples: [j-2AXK7Q1ZB3TQ9, j-3UN6WX5RRO2AG], ctx: emr_cluster}
      - {name: JAR, default: s3://<bucket>/jars/app.jar, samples: [s3://acme-data/jars/wordcount.jar, s3://etl-artifacts/jars/ingest-2.1.jar]}
      - {name: ARG, default: s3://<bucket>/input/, samples: [s3://acme-data/raw/2025/01/, s3://landing-zone/events/]}
    body: aws emr add-steps --cluster-id "$CLUSTER_ID" --steps "Type=CUSTOM_JAR,Name=custom-jar,Jar=$JAR,ActionOnFailure=CONTINUE,Args=[$ARG]"
    destructive: false
    source: https://github.com/aws/aws-cli/blob/v2/awscli/customizations/emr/steputils.py
    verified: source

  - id: aws-emr.steps.add-script-runner
    group: steps
    intents:
      - run shell script {SCRIPT} from s3 as an emr step
      - add a step that runs a bash script stored in s3
      - emr script-runner step
      - execute a .sh file on the master node via a step
      - submit a shell script step to {CLUSTER_ID}
    vars:
      - {name: CLUSTER_ID, default: <cluster-id>, samples: [j-2AXK7Q1ZB3TQ9, j-1K48ZPLW9HCBT], ctx: emr_cluster}
      - {name: REGION, default: us-east-1, samples: [us-west-2, eu-west-1], ctx: aws_region}
      - {name: SCRIPT, default: s3://<bucket>/scripts/run.sh, samples: [s3://acme-data/scripts/install_deps.sh, s3://etl-artifacts/scripts/cleanup_tmp.sh]}
    body: aws emr add-steps --cluster-id "$CLUSTER_ID" --steps "Type=CUSTOM_JAR,Name=script,ActionOnFailure=CONTINUE,Jar=s3://$REGION.elasticmapreduce/libs/script-runner/script-runner.jar,Args=[$SCRIPT]"
    destructive: false
    source: https://awscli.amazonaws.com/v2/documentation/api/latest/reference/emr/add-steps.html
    verified: docs

  - id: aws-emr.steps.add-from-file
    group: steps
    intents:
      - add emr steps defined in {FILE}
      - submit steps from a json file
      - load step definitions from a local json and add them
      - add-steps using file://
      - submit several steps at once from a file
    vars:
      - {name: CLUSTER_ID, default: <cluster-id>, samples: [j-2AXK7Q1ZB3TQ9, j-3UN6WX5RRO2AG], ctx: emr_cluster}
      - {name: FILE, default: steps.json, samples: [nightly_steps.json, conf/emr-steps.json], ctx: local_file}
    body: aws emr add-steps --cluster-id "$CLUSTER_ID" --steps "file://$FILE"
    destructive: false
    source: https://awscli.amazonaws.com/v2/documentation/api/latest/reference/emr/add-steps.html
    verified: docs

  - id: aws-emr.steps.add-get-id
    group: steps
    intents:
      - submit a spark step and print only the step id
      - add a step and give me back the step id
      - submit spark job to emr and capture the id
      - add-steps returning just the id text
    vars:
      - {name: CLUSTER_ID, default: <cluster-id>, samples: [j-2AXK7Q1ZB3TQ9, j-1K48ZPLW9HCBT], ctx: emr_cluster}
      - {name: SCRIPT, default: s3://<bucket>/jobs/etl.py, samples: [s3://acme-data/jobs/daily_etl.py, s3://analytics-code/spark/sessionize.py]}
    body: aws emr add-steps --cluster-id "$CLUSTER_ID" --steps "Type=Spark,Name=spark-step,ActionOnFailure=CONTINUE,Args=[--deploy-mode,cluster,$SCRIPT]" --query 'StepIds[0]' --output text
    destructive: false
    source: https://github.com/aws/aws-cli/blob/v2/awscli/customizations/emr/addsteps.py
    verified: source

  # ---------------- steps: monitor ----------------
  - id: aws-emr.steps.list
    group: steps
    intents:
      - list steps on emr cluster {CLUSTER_ID}
      - show all steps for the cluster
      - what steps ran on this cluster
      - emr list-steps
      - step history for {CLUSTER_ID}
    vars:
      - {name: CLUSTER_ID, default: <cluster-id>, samples: [j-2AXK7Q1ZB3TQ9, j-1K48ZPLW9HCBT, j-3UN6WX5RRO2AG], ctx: emr_cluster}
    body: aws emr list-steps --cluster-id "$CLUSTER_ID"
    destructive: false
    source: https://github.com/boto/botocore/tree/develop/botocore/data/emr
    verified: help

  - id: aws-emr.steps.list-by-state
    group: steps
    intents:
      - list {STATE} steps on {CLUSTER_ID}
      - show only steps in state {STATE}
      - which steps are currently running on the cluster
      - filter emr steps by status
    vars:
      - {name: CLUSTER_ID, default: <cluster-id>, samples: [j-2AXK7Q1ZB3TQ9, j-1K48ZPLW9HCBT], ctx: emr_cluster}
      - {name: STATE, default: RUNNING, samples: [FAILED, PENDING, COMPLETED, CANCELLED]}
    body: aws emr list-steps --cluster-id "$CLUSTER_ID" --step-states "$STATE"
    destructive: false
    source: https://github.com/boto/botocore/tree/develop/botocore/data/emr
    verified: help

  # An intent that names a state gets a template whose default is that state.
  - id: aws-emr.steps.list-failed
    group: steps
    intents:
      - find failed emr steps
      - which steps failed on {CLUSTER_ID}
      - show the emr steps that failed
    vars:
      - {name: CLUSTER_ID, default: <cluster-id>, samples: [j-2AXK7Q1ZB3TQ9, j-1K48ZPLW9HCBT], ctx: emr_cluster}
      - {name: STATE, default: FAILED}
    body: aws emr list-steps --cluster-id "$CLUSTER_ID" --step-states "$STATE"
    destructive: false
    source: https://github.com/boto/botocore/tree/develop/botocore/data/emr
    verified: help

  - id: aws-emr.steps.list-table
    group: steps
    intents:
      - show emr steps as a table with id name and state
      - list steps compactly for {CLUSTER_ID}
      - step ids names and statuses in a table
      - quick overview of steps on the cluster
    vars:
      - {name: CLUSTER_ID, default: <cluster-id>, samples: [j-2AXK7Q1ZB3TQ9, j-3UN6WX5RRO2AG], ctx: emr_cluster}
    body: aws emr list-steps --cluster-id "$CLUSTER_ID" --query 'Steps[].[Id,Name,Status.State]' --output table
    destructive: false
    source: https://github.com/boto/botocore/tree/develop/botocore/data/emr
    verified: help

  - id: aws-emr.steps.latest-state
    group: steps
    intents:
      - what's the state of the most recent step on {CLUSTER_ID}
      - status of the last emr step
      - did my latest step finish
      - newest step id and state
    vars:
      - {name: CLUSTER_ID, default: <cluster-id>, samples: [j-2AXK7Q1ZB3TQ9, j-1K48ZPLW9HCBT], ctx: emr_cluster}
    body: aws emr list-steps --cluster-id "$CLUSTER_ID" --max-items 1 --query 'Steps[0].[Id,Name,Status.State]' --output text
    destructive: false
    source: https://github.com/boto/botocore/tree/develop/botocore/data/emr
    verified: help

  - id: aws-emr.steps.describe
    group: steps
    intents:
      - describe step {STEP_ID} on cluster {CLUSTER_ID}
      - show details of an emr step
      - get full info for a step
      - emr describe-step
    vars:
      - {name: CLUSTER_ID, default: <cluster-id>, samples: [j-2AXK7Q1ZB3TQ9, j-3UN6WX5RRO2AG], ctx: emr_cluster}
      - {name: STEP_ID, default: <step-id>, samples: [s-2LFQ3XYZ8ABC1, s-1NV9KQ0TT7W2E, s-3HD8PLM4QZX6R]}
    body: aws emr describe-step --cluster-id "$CLUSTER_ID" --step-id "$STEP_ID"
    destructive: false
    source: https://github.com/boto/botocore/tree/develop/botocore/data/emr
    verified: help

  - id: aws-emr.steps.state
    group: steps
    intents:
      - is step {STEP_ID} done
      - just print the state of an emr step
      - check status of step {STEP_ID}
      - step state as plain text
      - has my emr step completed yet
    vars:
      - {name: CLUSTER_ID, default: <cluster-id>, samples: [j-2AXK7Q1ZB3TQ9, j-1K48ZPLW9HCBT], ctx: emr_cluster}
      - {name: STEP_ID, default: <step-id>, samples: [s-2LFQ3XYZ8ABC1, s-1NV9KQ0TT7W2E]}
    body: aws emr describe-step --cluster-id "$CLUSTER_ID" --step-id "$STEP_ID" --query 'Step.Status.State' --output text
    destructive: false
    source: https://github.com/boto/botocore/tree/develop/botocore/data/emr
    verified: help

  - id: aws-emr.steps.failure-reason
    group: steps
    intents:
      - why did step {STEP_ID} fail
      - show the failure details for an emr step
      - get the error reason and log file of a failed step
      - emr step failure message
    vars:
      - {name: CLUSTER_ID, default: <cluster-id>, samples: [j-2AXK7Q1ZB3TQ9, j-3UN6WX5RRO2AG], ctx: emr_cluster}
      - {name: STEP_ID, default: <step-id>, samples: [s-2LFQ3XYZ8ABC1, s-3HD8PLM4QZX6R]}
    body: aws emr describe-step --cluster-id "$CLUSTER_ID" --step-id "$STEP_ID" --query 'Step.Status.FailureDetails'
    destructive: false
    source: https://github.com/boto/botocore/tree/develop/botocore/data/emr
    verified: help

  - id: aws-emr.steps.wait
    group: steps
    intents:
      - wait until step {STEP_ID} completes
      - block until the emr step finishes
      - poll until my step is done
      - emr wait step-complete
      - hang here till the step succeeds
    vars:
      - {name: CLUSTER_ID, default: <cluster-id>, samples: [j-2AXK7Q1ZB3TQ9, j-1K48ZPLW9HCBT], ctx: emr_cluster}
      - {name: STEP_ID, default: <step-id>, samples: [s-2LFQ3XYZ8ABC1, s-1NV9KQ0TT7W2E]}
    body: aws emr wait step-complete --cluster-id "$CLUSTER_ID" --step-id "$STEP_ID"
    destructive: false
    source: https://github.com/boto/botocore/tree/develop/botocore/data/emr
    verified: help

  - id: aws-emr.steps.cancel
    group: steps
    intents:
      - cancel step {STEP_ID} on {CLUSTER_ID}
      - kill a running emr step
      - stop that emr step
      - emr cancel-steps
      - abort the pending step
    vars:
      - {name: CLUSTER_ID, default: <cluster-id>, samples: [j-2AXK7Q1ZB3TQ9, j-3UN6WX5RRO2AG], ctx: emr_cluster}
      - {name: STEP_ID, default: <step-id>, samples: [s-2LFQ3XYZ8ABC1, s-3HD8PLM4QZX6R]}
    body: aws emr cancel-steps --cluster-id "$CLUSTER_ID" --step-ids "$STEP_ID"
    destructive: true
    source: https://github.com/boto/botocore/tree/develop/botocore/data/emr
    verified: help

  - id: aws-emr.steps.stderr
    group: logs
    intents:
      - show the stderr log of step {STEP_ID}
      - read the last lines of an emr step's error log from s3
      - get step logs for a failed emr step
      - tail the step stderr from the log bucket
      - where's the spark error for my step, show it
    vars:
      - {name: LOG_URI, default: s3://<bucket>/emr-logs, samples: [s3://acme-logs/emr, s3://data-platform-logs/elasticmapreduce]}
      - {name: CLUSTER_ID, default: <cluster-id>, samples: [j-2AXK7Q1ZB3TQ9, j-1K48ZPLW9HCBT], ctx: emr_cluster}
      - {name: STEP_ID, default: <step-id>, samples: [s-2LFQ3XYZ8ABC1, s-1NV9KQ0TT7W2E]}
    body: aws s3 cp "$LOG_URI/$CLUSTER_ID/steps/$STEP_ID/stderr.gz" - | gunzip | tail -n 100
    destructive: false
    source: https://awscli.amazonaws.com/v2/documentation/api/latest/reference/s3/cp.html
    verified: help
    notes: "Step logs land under <log-uri>/<cluster-id>/steps/<step-id>/ a few minutes after the step ends."

  - id: aws-emr.steps.list-logs
    group: logs
    intents:
      - list the log files for step {STEP_ID}
      - what logs exist for this emr step in s3
      - browse the step log folder
      - ls the emr step logs
    vars:
      - {name: LOG_URI, default: s3://<bucket>/emr-logs, samples: [s3://acme-logs/emr, s3://data-platform-logs/elasticmapreduce]}
      - {name: CLUSTER_ID, default: <cluster-id>, samples: [j-2AXK7Q1ZB3TQ9, j-3UN6WX5RRO2AG], ctx: emr_cluster}
      - {name: STEP_ID, default: <step-id>, samples: [s-2LFQ3XYZ8ABC1, s-3HD8PLM4QZX6R]}
    body: aws s3 ls "$LOG_URI/$CLUSTER_ID/steps/$STEP_ID/"
    destructive: false
    source: https://awscli.amazonaws.com/v2/documentation/api/latest/reference/s3/ls.html
    verified: help

  - id: aws-emr.cluster.log-uri
    group: logs
    intents:
