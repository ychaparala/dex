  - id: aws-emr.cluster.create
    group: clusters
    intents:
      - create an emr cluster {NAME} with spark on release {RELEASE}
      - spin up a new emr cluster with {COUNT} {INSTANCE_TYPE} nodes
      - launch a spark cluster on emr
      - emr create-cluster with default roles
      - start a fresh emr cluster
    vars:
      - {name: NAME, default: my-cluster, samples: [adhoc-spark, nightly-etl, backfill-2025]}
      - {name: RELEASE, default: emr-7.5.0, samples: [emr-7.3.0, emr-6.15.0, emr-7.1.0]}
      - {name: INSTANCE_TYPE, default: m5.xlarge, samples: [r5.2xlarge, m6g.xlarge, c5.4xlarge]}
      - {name: COUNT, default: "3", samples: ["2", "5", "10"]}
    body: aws emr create-cluster --name "$NAME" --release-label "$RELEASE" --applications Name=Spark Name=Hadoop --instance-type "$INSTANCE_TYPE" --instance-count "$COUNT" --use-default-roles
    destructive: false
    source: https://github.com/aws/aws-cli/blob/v2/awscli/customizations/emr/createcluster.py
    verified: source

  - id: aws-emr.cluster.create-logs-idle
    group: clusters
    intents:
      - create an emr cluster that logs to {BUCKET} and shuts down after {IDLE} seconds idle
      - launch emr with a log uri and idle auto termination
      - create a cluster that terminates itself when idle
      - emr cluster with logging and auto-termination policy
    vars:
      - {name: NAME, default: my-cluster, samples: [adhoc-spark, dev-sandbox]}
      - {name: RELEASE, default: emr-7.5.0, samples: [emr-7.3.0, emr-6.15.0]}
      - {name: BUCKET, default: <bucket>, samples: [acme-logs, data-platform-logs], ctx: s3_bucket}
      - {name: IDLE, default: "3600", samples: ["1800", "7200"]}
    body: aws emr create-cluster --name "$NAME" --release-label "$RELEASE" --applications Name=Spark --instance-type m5.xlarge --instance-count 3 --use-default-roles --log-uri "s3://$BUCKET/emr-logs/" --auto-termination-policy IdleTimeout="$IDLE"
    destructive: false
    source: https://github.com/aws/aws-cli/blob/v2/awscli/customizations/emr/createcluster.py
    verified: source

  - id: aws-emr.cluster.create-transient
    group: clusters
    intents:
      - create a transient emr cluster that runs {SCRIPT} and then terminates
      - spin up emr, run one spark step, auto terminate
      - one-shot cluster for a spark job
      - create cluster with a step and --auto-terminate
      - launch an ephemeral spark cluster for my script
    vars:
      - {name: NAME, default: my-cluster, samples: [nightly-etl, backfill-job]}
      - {name: SCRIPT, default: s3://<bucket>/jobs/etl.py, samples: [s3://acme-data/jobs/daily_etl.py, s3://analytics-code/spark/backfill.py]}
    body: aws emr create-cluster --name "$NAME" --release-label emr-7.5.0 --applications Name=Spark --instance-type m5.xlarge --instance-count 3 --use-default-roles --steps "Type=Spark,Name=main,ActionOnFailure=TERMINATE_CLUSTER,Args=[--deploy-mode,cluster,$SCRIPT]" --auto-terminate
    destructive: false
    source: https://github.com/aws/aws-cli/blob/v2/awscli/customizations/emr/createcluster.py
    verified: source

