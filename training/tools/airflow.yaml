tool: airflow
binaries:
- airflow
category: orchestration
priority: core
target_pairs: 350
version_note: Apache Airflow 3.x CLI (checked against 3.4.0); templates with id suffix .af2 are Airflow 2.x syntax (2.10, common on MWAA)
version_cmd: airflow version
version_label: airflow
versions:
- {version: "3.4.0", install: "pip:apache-airflow==3.4.0"}
- {version: "2.10.5", install: "pip:apache-airflow==2.10.5", python: "3.12", constraints: "https://raw.githubusercontent.com/apache/airflow/constraints-2.10.5/constraints-3.12.txt"}
sources:
- url: https://github.com/apache/airflow/blob/3.4.0/airflow-core/src/airflow/cli/cli_config.py
  license: Apache-2.0 (repo)
- url: https://github.com/apache/airflow/blob/2.10.5/airflow/cli/cli_config.py
  license: Apache-2.0 (repo)
- url: https://github.com/apache/airflow/blob/2.10.5/airflow/providers/fab/auth_manager/cli_commands/definition.py
  license: Apache-2.0 (repo)
- url: https://github.com/apache/airflow/blob/main/airflow-core/docs/start.rst
  license: Apache-2.0 (repo)
destructive_patterns:
- \bairflow\s+dags\s+delete\b
- \bairflow\s+(connections|variables|pools)\s+delete\b
- \bairflow\s+db\s+(reset|clean|drop-archived|downgrade)\b
templates:
- id: airflow.dags.list
  group: dags
  intents:
  - list all dags
  - show me every dag airflow knows about
  - airflow list dags
  - which dags are deployed
  - what dags do we have
  vars: []
  body: airflow dags list
  destructive: false
  source: https://github.com/apache/airflow/blob/3.4.0/airflow-core/src/airflow/cli/cli_config.py
  verified: source
- id: airflow.dags.list.ids
  group: dags
  intents:
  - print just the dag ids
  - list dag ids only, one per line
  - get the names of all dags as plain text
  - dump dag ids from airflow as json and extract them
  vars: []
  body: airflow dags list -o json | jq -r '.[].dag_id'
  destructive: false
  source: https://github.com/apache/airflow/blob/3.4.0/airflow-core/src/airflow/cli/cli_config.py
  verified: source
- id: airflow.dags.list.grep
  group: dags
  intents:
  - find dags whose name contains {PATTERN}
  - search the dag list for {PATTERN}
  - is there a dag matching {PATTERN}
  - grep airflow dags by name
  vars:
  - {name: PATTERN, default: sales, samples: [orders, finance, s3]}
  body: airflow dags list | grep -i "$PATTERN"
  destructive: false
  source: https://github.com/apache/airflow/blob/3.4.0/airflow-core/src/airflow/cli/cli_config.py
  verified: source
- id: airflow.dags.list_import_errors
  group: dags
  intents:
  - show dag import errors
  - why are my dags broken, list import errors
  - which dag files failed to parse
  - airflow import errors
  - list dags that fail to load
  vars: []
  body: airflow dags list-import-errors
  destructive: false
  source: https://github.com/apache/airflow/blob/3.4.0/airflow-core/src/airflow/cli/cli_config.py
  verified: source
- id: airflow.dags.details
  group: dags
  intents:
  - show details for dag {DAG_ID}
  - describe the {DAG_ID} dag
  - get schedule and owner info for a dag
  - airflow dag details
  vars:
  - {name: DAG_ID, default: daily_sales_etl, samples: [orders_ingest, customer_dim_refresh, hourly_events_load], ctx: airflow_dag}
  body: airflow dags details "$DAG_ID"
  destructive: false
  source: https://github.com/apache/airflow/blob/3.4.0/airflow-core/src/airflow/cli/cli_config.py
  verified: source
- id: airflow.dags.trigger
  group: dags
  intents:
  - trigger {DAG_ID}
  - kick off a run of {DAG_ID} now
  - start the dag manually
  - run dag {DAG_ID} right now
  - manually trigger an airflow dag
  vars:
  - {name: DAG_ID, default: daily_sales_etl, samples: [orders_ingest, customer_dim_refresh, hourly_events_load], ctx: airflow_dag}
  body: airflow dags trigger "$DAG_ID"
  destructive: false
  source: https://github.com/apache/airflow/blob/3.4.0/airflow-core/src/airflow/cli/cli_config.py
  verified: source
- id: airflow.dags.trigger.conf
  group: dags
  intents:
  - trigger {DAG_ID} with config {CONF}
  - start a dag run passing json conf
  - 'run {DAG_ID} with these params: {CONF}'
  - trigger a dag with a conf payload
  vars:
  - {name: DAG_ID, default: daily_sales_etl, samples: [orders_ingest, customer_dim_refresh, hourly_events_load], ctx: airflow_dag}
  - {name: CONF, default: '{"run_date": "2025-06-01"}', samples: ['{"full_refresh": true}', '{"table": "orders", "limit": 100}', '{"env": "staging"}']}
  body: airflow dags trigger "$DAG_ID" --conf "$CONF"
  destructive: false
  source: https://github.com/apache/airflow/blob/3.4.0/airflow-core/src/airflow/cli/cli_config.py
  verified: source
- id: airflow.dags.trigger.logical_date
  group: dags
  intents:
  - trigger {DAG_ID} for logical date {LOGICAL_DATE}
  - run the dag as of {LOGICAL_DATE}
  - start a dag run for a specific date
  - trigger dag with a logical date
  vars:
  - {name: DAG_ID, default: daily_sales_etl, samples: [orders_ingest, customer_dim_refresh, hourly_events_load], ctx: airflow_dag}
  - {name: LOGICAL_DATE, default: '2025-06-01', samples: ['2025-01-15', '2024-12-31', '2025-06-01T06:00:00']}
  body: airflow dags trigger "$DAG_ID" --logical-date "$LOGICAL_DATE"
  destructive: false
  source: https://github.com/apache/airflow/blob/3.4.0/airflow-core/src/airflow/cli/cli_config.py
  verified: source
- id: airflow.dags.trigger.run_id
  group: dags
  intents:
  - trigger {DAG_ID} with run id {RUN_ID}
  - start a dag run and name the run {RUN_ID}
  - trigger a dag with a custom run id
  - kick off {DAG_ID} using my own run id
  vars:
  - {name: DAG_ID, default: daily_sales_etl, samples: [orders_ingest, customer_dim_refresh, hourly_events_load], ctx: airflow_dag}
  - {name: RUN_ID, default: manual_backfill_fix_01, samples: [hotfix_rerun_2025_06_01, adhoc_test_run, reload_after_outage]}
  body: airflow dags trigger "$DAG_ID" --run-id "$RUN_ID"
  destructive: false
  source: https://github.com/apache/airflow/blob/3.4.0/airflow-core/src/airflow/cli/cli_config.py
  verified: source
- id: airflow.dags.pause
  group: dags
  intents:
  - pause {DAG_ID}
  - stop scheduling the dag {DAG_ID}
  - turn off the dag
  - disable a dag so it doesn't run
  - pause an airflow dag
  vars:
  - {name: DAG_ID, default: daily_sales_etl, samples: [orders_ingest, customer_dim_refresh, hourly_events_load], ctx: airflow_dag}
  body: airflow dags pause "$DAG_ID"
  destructive: false
  source: https://github.com/apache/airflow/blob/3.4.0/airflow-core/src/airflow/cli/cli_config.py
  verified: source
- id: airflow.dags.unpause
  group: dags
  intents:
  - unpause {DAG_ID}
  - turn the dag {DAG_ID} back on
  - resume scheduling a dag
  - enable a paused dag
  - activate dag {DAG_ID}
  vars:
  - {name: DAG_ID, default: daily_sales_etl, samples: [orders_ingest, customer_dim_refresh, hourly_events_load], ctx: airflow_dag}
  body: airflow dags unpause "$DAG_ID"
  destructive: false
  source: https://github.com/apache/airflow/blob/3.4.0/airflow-core/src/airflow/cli/cli_config.py
  verified: source
- id: airflow.dags.pause.regex
  group: dags
  intents:
  - pause every dag matching {PATTERN}
  - pause all dags whose id matches a regex
  - turn off all {PATTERN} dags at once
  - bulk pause dags by pattern without prompting
  vars:
  - {name: PATTERN, default: ^finance_, samples: [_staging$, ^legacy_, hourly]}
  body: airflow dags pause "$PATTERN" --treat-dag-id-as-regex --yes
  destructive: false
  source: https://github.com/apache/airflow/blob/3.4.0/airflow-core/src/airflow/cli/cli_config.py
  verified: source
- id: airflow.dags.list_runs
  group: runs
  intents:
  - list runs of {DAG_ID}
  - show recent dag runs for {DAG_ID}
  - what runs has this dag had
  - airflow dag run history
  - show run history for a dag
  vars:
  - {name: DAG_ID, default: daily_sales_etl, samples: [orders_ingest, customer_dim_refresh, hourly_events_load], ctx: airflow_dag}
  body: airflow dags list-runs "$DAG_ID"
  destructive: false
  source: https://github.com/apache/airflow/blob/3.4.0/airflow-core/src/airflow/cli/cli_config.py
  verified: source
- id: airflow.dags.list_runs.state
  group: runs
  intents:
  - show {STATE} runs of {DAG_ID}
  - list dag runs filtered by state
  - which runs of {DAG_ID} are {STATE}
  - find {STATE} dag runs
  vars:
  - {name: DAG_ID, default: daily_sales_etl, samples: [orders_ingest, customer_dim_refresh, hourly_events_load], ctx: airflow_dag}
  - {name: STATE, default: failed, samples: [running, success, queued]}
  body: airflow dags list-runs "$DAG_ID" --state "$STATE"
  destructive: false
  source: https://github.com/apache/airflow/blob/3.4.0/airflow-core/src/airflow/cli/cli_config.py
  verified: source
- id: airflow.dags.list_runs.json
  group: runs
  intents:
  - get the run ids and states of {DAG_ID} as json
  - list dag runs as json with jq
  - print run id and state for each run of a dag
  - dag runs in json, just id and state
  vars:
  - {name: DAG_ID, default: daily_sales_etl, samples: [orders_ingest, customer_dim_refresh, hourly_events_load], ctx: airflow_dag}
  body: airflow dags list-runs "$DAG_ID" -o json | jq -r '.[] | [.run_id, .state] | @tsv'
  destructive: false
  source: https://github.com/apache/airflow/blob/3.4.0/airflow-core/src/airflow/cli/cli_config.py
  verified: source
- id: airflow.dags.state
  group: runs
  intents:
  - what's the status of run {RUN_ID} of {DAG_ID}
  - check the state of a dag run
  - did the dag run succeed
  - get dag run state for {DAG_ID}
  vars:
  - {name: DAG_ID, default: daily_sales_etl, samples: [orders_ingest, customer_dim_refresh, hourly_events_load], ctx: airflow_dag}
  - {name: RUN_ID, default: 'manual__2025-06-01T00:00:00+00:00', samples: ['scheduled__2025-05-31T00:00:00+00:00', 'manual__2025-06-02T08:30:00+00:00', '2025-06-01']}
  body: airflow dags state "$DAG_ID" "$RUN_ID"
  destructive: false
  source: https://github.com/apache/airflow/blob/3.4.0/airflow-core/src/airflow/cli/cli_config.py
  verified: source
- id: airflow.dags.next_execution
  group: dags
  intents:
  - when does {DAG_ID} run next
  - next scheduled run of a dag
  - show the next logical date for {DAG_ID}
  - when is the next execution
  vars:
  - {name: DAG_ID, default: daily_sales_etl, samples: [orders_ingest, customer_dim_refresh, hourly_events_load], ctx: airflow_dag}
  body: airflow dags next-execution "$DAG_ID"
  destructive: false
  source: https://github.com/apache/airflow/blob/3.4.0/airflow-core/src/airflow/cli/cli_config.py
  verified: source
- id: airflow.dags.test
  group: dev
  intents:
  - test {DAG_ID} locally for {LOGICAL_DATE}
  - run the whole dag once in-process to debug it
  - do a local test run of dag {DAG_ID}
  - debug a dag end to end without the scheduler
  vars:
  - {name: DAG_ID, default: daily_sales_etl, samples: [orders_ingest, customer_dim_refresh, hourly_events_load], ctx: airflow_dag}
  - {name: LOGICAL_DATE, default: '2025-06-01', samples: ['2025-01-15', '2024-12-31', '2025-06-01T06:00:00']}
  body: airflow dags test "$DAG_ID" "$LOGICAL_DATE"
  destructive: false
  source: https://github.com/apache/airflow/blob/3.4.0/airflow-core/src/airflow/cli/cli_config.py
  verified: source
- id: airflow.dags.show
  group: dags
  intents:
  - save a graph image of {DAG_ID} to {FILE}
  - render the dag structure to a png
  - export the dag's task graph as an image
  - draw dag dependencies to a file
  vars:
  - {name: DAG_ID, default: daily_sales_etl, samples: [orders_ingest, customer_dim_refresh, hourly_events_load], ctx: airflow_dag}
  - {name: FILE, default: dag.png, samples: [etl_graph.png, dag.dot, graph.svg], ctx: local_file}
  body: airflow dags show "$DAG_ID" --save "$FILE"
  destructive: false
  source: https://github.com/apache/airflow/blob/3.4.0/airflow-core/src/airflow/cli/cli_config.py
  verified: source
- id: airflow.dags.reserialize
  group: dags
  intents:
  - reserialize all dags
  - force airflow to re-parse dags into the db
  - refresh serialized dags in the metadata db
  - dags out of sync, reserialize them
  vars: []
  body: airflow dags reserialize
  destructive: false
  source: https://github.com/apache/airflow/blob/3.4.0/airflow-core/src/airflow/cli/cli_config.py
  verified: source
- id: airflow.dags.delete
  group: dags
  intents:
  - delete all records of dag {DAG_ID}
  - remove a dag's history from the metadata db
  - wipe dag {DAG_ID} from airflow without prompting
  - purge a dag's runs and metadata
  vars:
  - {name: DAG_ID, default: daily_sales_etl, samples: [orders_ingest, customer_dim_refresh, hourly_events_load], ctx: airflow_dag}
  body: airflow dags delete "$DAG_ID" --yes
  destructive: true
  source: https://github.com/apache/airflow/blob/3.4.0/airflow-core/src/airflow/cli/cli_config.py
  verified: source
- id: airflow.tasks.list
  group: tasks
  intents:
  - list tasks in {DAG_ID}
  - what tasks does this dag have
  - show the task ids of a dag
  - airflow tasks list for {DAG_ID}
  vars:
  - {name: DAG_ID, default: daily_sales_etl, samples: [orders_ingest, customer_dim_refresh, hourly_events_load], ctx: airflow_dag}
  body: airflow tasks list "$DAG_ID"
  destructive: false
  source: https://github.com/apache/airflow/blob/3.4.0/airflow-core/src/airflow/cli/cli_config.py
  verified: source
- id: airflow.tasks.test
  group: dev
  intents:
  - test task {TASK_ID} in {DAG_ID}
  - run a single task locally without recording state
  - debug one airflow task for {LOGICAL_DATE}
  - try out a task in isolation
  vars:
  - {name: DAG_ID, default: daily_sales_etl, samples: [orders_ingest, customer_dim_refresh, hourly_events_load], ctx: airflow_dag}
  - {name: TASK_ID, default: extract_orders, samples: [load_to_warehouse, transform_sales, send_report]}
  - {name: LOGICAL_DATE, default: '2025-06-01', samples: ['2025-01-15', '2024-12-31', '2025-06-01T06:00:00']}
  body: airflow tasks test "$DAG_ID" "$TASK_ID" "$LOGICAL_DATE"
  destructive: false
  source: https://github.com/apache/airflow/blob/3.4.0/airflow-core/src/airflow/cli/cli_config.py
  verified: source
- id: airflow.tasks.states_for_dag_run
  group: tasks
  intents:
  - show the state of every task in run {RUN_ID}
  - which tasks failed in this dag run
  - task statuses for a dag run of {DAG_ID}
  - list task instance states for a run
  vars:
  - {name: DAG_ID, default: daily_sales_etl, samples: [orders_ingest, customer_dim_refresh, hourly_events_load], ctx: airflow_dag}
  - {name: RUN_ID, default: 'manual__2025-06-01T00:00:00+00:00', samples: ['scheduled__2025-05-31T00:00:00+00:00', 'manual__2025-06-02T08:30:00+00:00', '2025-06-01']}
  body: airflow tasks states-for-dag-run "$DAG_ID" "$RUN_ID"
  destructive: false
  source: https://github.com/apache/airflow/blob/3.4.0/airflow-core/src/airflow/cli/cli_config.py
  verified: source
- id: airflow.tasks.state
  group: tasks
  intents:
  - what's the state of task {TASK_ID} in run {RUN_ID}
  - check one task instance status
  - did task {TASK_ID} succeed
  - get task instance state
  vars:
  - {name: DAG_ID, default: daily_sales_etl, samples: [orders_ingest, customer_dim_refresh, hourly_events_load], ctx: airflow_dag}
  - {name: TASK_ID, default: extract_orders, samples: [load_to_warehouse, transform_sales, send_report]}
  - {name: RUN_ID, default: 'manual__2025-06-01T00:00:00+00:00', samples: ['scheduled__2025-05-31T00:00:00+00:00', 'manual__2025-06-02T08:30:00+00:00', '2025-06-01']}
  body: airflow tasks state "$DAG_ID" "$TASK_ID" "$RUN_ID"
  destructive: false
  source: https://github.com/apache/airflow/blob/3.4.0/airflow-core/src/airflow/cli/cli_config.py
  verified: source
- id: airflow.tasks.failed_deps
  group: tasks
  intents:
  - why isn't task {TASK_ID} running
  - show unmet dependencies for a task instance
  - what is blocking this task from being scheduled
  - explain why a task is stuck
  vars:
  - {name: DAG_ID, default: daily_sales_etl, samples: [orders_ingest, customer_dim_refresh, hourly_events_load], ctx: airflow_dag}
  - {name: TASK_ID, default: extract_orders, samples: [load_to_warehouse, transform_sales, send_report]}
  - {name: RUN_ID, default: 'manual__2025-06-01T00:00:00+00:00', samples: ['scheduled__2025-05-31T00:00:00+00:00', 'manual__2025-06-02T08:30:00+00:00', '2025-06-01']}
  body: airflow tasks failed-deps "$DAG_ID" "$TASK_ID" "$RUN_ID"
  destructive: false
  source: https://github.com/apache/airflow/blob/3.4.0/airflow-core/src/airflow/cli/cli_config.py
  verified: source
- id: airflow.tasks.render
  group: tasks
  intents:
  - show the rendered templates of {TASK_ID}
  - render jinja for a task instance
  - see what sql a task will run after templating
  - print rendered template fields
  vars:
  - {name: DAG_ID, default: daily_sales_etl, samples: [orders_ingest, customer_dim_refresh, hourly_events_load], ctx: airflow_dag}
  - {name: TASK_ID, default: extract_orders, samples: [load_to_warehouse, transform_sales, send_report]}
  - {name: RUN_ID, default: 'manual__2025-06-01T00:00:00+00:00', samples: ['scheduled__2025-05-31T00:00:00+00:00', 'manual__2025-06-02T08:30:00+00:00', '2025-06-01']}
  body: airflow tasks render "$DAG_ID" "$TASK_ID" "$RUN_ID"
  destructive: false
  source: https://github.com/apache/airflow/blob/3.4.0/airflow-core/src/airflow/cli/cli_config.py
  verified: source
- id: airflow.tasks.clear
  group: tasks
  intents:
  - clear task {TASK_REGEX} in {DAG_ID} between {START_DATE} and {END_DATE}
  - rerun tasks matching a regex over a date range
  - clear task instances so they run again
  - reset tasks in a window so the scheduler reruns them
  vars:
  - {name: DAG_ID, default: daily_sales_etl, samples: [orders_ingest, customer_dim_refresh, hourly_events_load], ctx: airflow_dag}
  - {name: TASK_REGEX, default: ^load_, samples: [transform_sales, extract_.*, ^dbt_]}
  - {name: START_DATE, default: '2025-06-01', samples: ['2025-05-01', '2025-01-01']}
  - {name: END_DATE, default: '2025-06-07', samples: ['2025-05-31', '2025-01-31']}
  body: airflow tasks clear "$DAG_ID" --task-regex "$TASK_REGEX" --start-date "$START_DATE" --end-date "$END_DATE" --yes
  destructive: false
  source: https://github.com/apache/airflow/blob/3.4.0/airflow-core/src/airflow/cli/cli_config.py
  verified: source
- id: airflow.tasks.clear.failed
  group: tasks
  intents:
  - clear only the failed tasks of {DAG_ID} since {START_DATE}
  - rerun failed tasks in a dag
  - retry everything that failed since a date
  - clear failed task instances without asking
  vars:
  - {name: DAG_ID, default: daily_sales_etl, samples: [orders_ingest, customer_dim_refresh, hourly_events_load], ctx: airflow_dag}
  - {name: START_DATE, default: '2025-06-01', samples: ['2025-05-20', '2025-01-01']}
  body: airflow tasks clear "$DAG_ID" --only-failed --start-date "$START_DATE" --yes
  destructive: false
  source: https://github.com/apache/airflow/blob/3.4.0/airflow-core/src/airflow/cli/cli_config.py
  verified: source
- id: airflow.tasks.clear.downstream
  group: tasks
  intents:
  - clear {TASK_REGEX} and everything downstream
  - rerun a task plus its downstream tasks
  - clear a task and its children in {DAG_ID}
  - reset task and downstream for {START_DATE}
  vars:
  - {name: DAG_ID, default: daily_sales_etl, samples: [orders_ingest, customer_dim_refresh, hourly_events_load], ctx: airflow_dag}
  - {name: TASK_REGEX, default: ^transform_sales$, samples: [^extract_orders$, ^stage_]}
  - {name: START_DATE, default: '2025-06-01', samples: ['2025-05-31', '2025-04-15']}
  body: airflow tasks clear "$DAG_ID" -t "$TASK_REGEX" --downstream --start-date "$START_DATE" --end-date "$START_DATE" --yes
  destructive: false
  source: https://github.com/apache/airflow/blob/3.4.0/airflow-core/src/airflow/cli/cli_config.py
  verified: source
- id: airflow.backfill.create
  group: backfill
  intents:
  - backfill {DAG_ID} from {FROM_DATE} to {TO_DATE}
  - create a backfill for a date range
  - rerun history for a dag over a window
  - airflow 3 backfill
  - fill in missing runs between two dates
  vars:
  - {name: DAG_ID, default: daily_sales_etl, samples: [orders_ingest, customer_dim_refresh, hourly_events_load], ctx: airflow_dag}
  - {name: FROM_DATE, default: '2025-01-01', samples: ['2025-05-01', '2024-12-01']}
  - {name: TO_DATE, default: '2025-01-31', samples: ['2025-05-31', '2024-12-31']}
  body: airflow backfill create --dag-id "$DAG_ID" --from-date "$FROM_DATE" --to-date "$TO_DATE"
  destructive: false
  source: https://github.com/apache/airflow/blob/3.4.0/airflow-core/src/airflow/cli/cli_config.py
  verified: source
- id: airflow.backfill.create.reprocess
  group: backfill
  intents:
  - backfill {DAG_ID} and also rerun failed runs
  - backfill a range, redoing runs that errored
  - backfill with reprocess failed and max {MAX_RUNS} active runs
  - backfill but reprocess failures
  vars:
