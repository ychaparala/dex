tool: jq
binaries: [jq]
category: files
priority: standard
target_pairs: 150
version_note: "jq 1.7+ (every filter run against sample JSON with jq 1.7)"
install:
- macos: ["brew install jq"]
  linux: ["sudo apt-get install jq"]
  source: ["https://jqlang.org/download/"]
sources:
  - url: "local: jq --help and jq 1.7 runs on sample JSON/NDJSON"
    license: "MIT (jqlang/jq repo)"
  - url: https://jqlang.org/manual/
    license: "CC BY 3.0 (jq manual, jqlang/jq repo)"
  - url: https://jqlang.org/download/
    license: "CC BY 3.0 (jq site, jqlang/jq repo)"
templates:
  - id: jq.setup.install
    group: setup
    intents:
      - install jq on ubuntu
      - get the jq json tool
      - apt install jq
      - I need jq on this debian box
    body: sudo apt-get install -y jq
    destructive: false
    source: https://jqlang.org/download/
    verified: docs

  - id: jq.setup.version
    group: setup
    intents:
      - which jq version do I have
      - jq version
      - check if jq is installed
      - print the jq version
    body: jq --version
    destructive: false
    source: "local: jq --help"
    verified: help

  - id: jq.pretty
    group: basics
    intents:
      - pretty print {FILE}
      - format this json file so I can read it
      - show json nicely indented and colored
      - jq . a file
      - make a minified json readable
    vars:
      - {name: FILE, default: data.json, samples: [response.json, config.json, orders.json], ctx: local_file}
    body: jq . "$FILE"
    destructive: false
    source: https://jqlang.org/manual/
    verified: help

  - id: jq.field
    group: basics
    intents:
      - get the {FIELD} field from {FILE} as plain text
      - read one value out of a json file
      - extract a nested key without quotes
      - jq -r a single field
    vars:
      - {name: FIELD, default: name, samples: [name, version, db.host, metadata.owner]}
      - {name: FILE, default: data.json, samples: [config.json, manifest.json, package.json], ctx: local_file}
    body: jq -r ".$FIELD" "$FILE"
    destructive: false
    source: https://jqlang.org/manual/
    verified: help

  - id: jq.array_field
    group: basics
    intents:
      - list the {FIELD} of every element in the array in {FILE}
      - pull one field out of each object in a json array
      - print all ids from a json list, one per line
      - map an array to just one attribute
    vars:
      - {name: FIELD, default: id, samples: [id, name, email, order_id]}
      - {name: FILE, default: data.json, samples: [orders.json, users.json], ctx: local_file}
    body: jq -r ".[].$FIELD" "$FILE"
    destructive: false
    source: https://jqlang.org/manual/
    verified: help

  - id: jq.select_eq
    group: filter
    intents:
      - keep only objects in {FILE} where {FIELD} is {VALUE}
      - filter a json array by a field value
      - find records with status failed
      - jq select where field equals a string
    vars:
      - {name: FIELD, default: status, samples: [status, country, state]}
      - {name: VALUE, default: failed, samples: [failed, shipped, US, RUNNING]}
      - {name: FILE, default: data.json, samples: [orders.json, runs.json], ctx: local_file}
    body: jq --arg v "$VALUE" ".[] | select(.$FIELD == \$v)" "$FILE"
    destructive: false
    source: https://jqlang.org/manual/
    verified: help

  - id: jq.select_gt
    group: filter
    intents:
      - ids of records where {FIELD} is greater than {MIN}
      - filter json objects by a numeric threshold
      - which orders are above 100
      - jq numeric comparison select
    vars:
      - {name: FIELD, default: amount, samples: [amount, duration, rows]}
      - {name: MIN, default: "100", samples: ["0", "1000", "3600"]}
      - {name: FILE, default: data.json, samples: [orders.json, runs.json], ctx: local_file}
    body: jq -r ".[] | select(.$FIELD > $MIN) | .id" "$FILE"
    destructive: false
    source: https://jqlang.org/manual/
    verified: help

  - id: jq.project_fields
    group: transform
    intents:
      - keep only id, name and amount from each object
      - trim a json array down to a few fields
      - project selected keys from every record
      - jq map to a smaller object
    vars:
      - {name: FILE, default: data.json, samples: [orders.json, export.json], ctx: local_file}
    body: jq 'map({id, name, amount})' "$FILE"
    destructive: false
    source: https://jqlang.org/manual/
    verified: help

  - id: jq.length
    group: inspect
    intents:
      - how many elements are in the json array in {FILE}
      - count records in a json file
      - length of a json list
      - number of items returned by the api
    vars:
      - {name: FILE, default: data.json, samples: [orders.json, response.json], ctx: local_file}
    body: jq 'length' "$FILE"
    destructive: false
    source: https://jqlang.org/manual/
    verified: help

  - id: jq.keys
    group: inspect
    intents:
      - what keys does the first record in {FILE} have
      - list the fields of a json object
      - show the schema-ish keys of the first element
      - jq keys of first item
    vars:
      - {name: FILE, default: data.json, samples: [orders.json, events.json], ctx: local_file}
    body: jq -c '.[0] | keys' "$FILE"
    destructive: false
    source: https://jqlang.org/manual/
    verified: help

  - id: jq.paths
    group: inspect
    intents:
      - list every leaf path in {FILE} in dotted form
      - show all nested keys of a json config
      - flatten json paths to see the structure
      - what paths exist in this json
    vars:
      - {name: FILE, default: config.json, samples: [config.json, values.json, settings.json], ctx: local_file}
    body: jq -r 'paths(scalars) | map(tostring) | join(".")' "$FILE"
    destructive: false
    source: https://jqlang.org/manual/
    verified: help

  - id: jq.to_csv
    group: convert
    intents:
      - convert the json array in {FILE} to csv
      - turn json records into csv rows with jq
      - export id, name and amount as csv to {OUT_FILE}
      - jq @csv
    vars:
      - {name: FILE, default: data.json, samples: [orders.json, users.json], ctx: local_file}
      - {name: OUT_FILE, default: out.csv, samples: [orders.csv, users.csv]}
    body: jq -r '.[] | [.id, .name, .amount] | @csv' "$FILE" > "$OUT_FILE"
    destructive: false
    source: https://jqlang.org/manual/
    verified: help

  - id: jq.compact
    group: convert
    intents:
      - minify {FILE} onto one line
      - compact json output
      - strip whitespace from a json file
      - jq -c
    vars:
      - {name: FILE, default: data.json, samples: [config.json, payload.json], ctx: local_file}
    body: jq -c . "$FILE"
    destructive: false
    source: https://jqlang.org/manual/
    verified: help

  - id: jq.array_to_ndjson
    group: convert
    intents:
      - convert a json array to newline-delimited json
      - write one record per line from {FILE}
      - json array to ndjson / jsonl
      - explode a json list into lines for bigquery load
    vars:
      - {name: FILE, default: data.json, samples: [orders.json, export.json], ctx: local_file}
      - {name: OUT_FILE, default: out.ndjson, samples: [orders.ndjson, export.jsonl]}
    body: jq -c '.[]' "$FILE" > "$OUT_FILE"
    destructive: false
    source: https://jqlang.org/manual/
    verified: help

  - id: jq.slurp_ndjson
    group: convert
    intents:
      - turn the ndjson file {FILE} into one json array
      - slurp jsonl lines into an array
      - combine newline-delimited json into a list
      - jq -s
    vars:
      - {name: FILE, default: events.ndjson, samples: [events.ndjson, logs.jsonl], ctx: local_file}
    body: jq -s . "$FILE"
    destructive: false
    source: https://jqlang.org/manual/
    verified: help

  - id: jq.ndjson_filter
    group: ndjson
    intents:
      - keep only ERROR lines from the json log {FILE}
      - grep ndjson by level with jq
      - filter newline-delimited json records
      - show error events from a jsonl file
    vars:
      - {name: FILE, default: events.ndjson, samples: [app.ndjson, events.jsonl], ctx: local_file}
    body: jq -c 'select(.level == "ERROR")' "$FILE"
    destructive: false
    source: https://jqlang.org/manual/
    verified: help

  - id: jq.group_count
    group: aggregate
    intents:
      - count ndjson records by {FIELD}
      - group events by status and count them
      - how many rows per value of a field, with jq
      - jq group_by and length
    vars:
      - {name: FIELD, default: status, samples: [status, level, country]}
      - {name: FILE, default: events.ndjson, samples: [events.ndjson, orders.jsonl], ctx: local_file}
    body: 'jq -s "group_by(.$FIELD) | map({key: .[0].$FIELD, count: length})" "$FILE"'
    destructive: false
    source: https://jqlang.org/manual/
    verified: help

  - id: jq.sum
    group: aggregate
    intents:
      - sum the {FIELD} field across the array in {FILE}
      - total amount from a json list
      - add up a numeric field with jq
      - what's the total of all amounts
    vars:
      - {name: FIELD, default: amount, samples: [amount, bytes, rows]}
      - {name: FILE, default: data.json, samples: [orders.json, usage.json], ctx: local_file}
    body: jq "[.[].$FIELD] | add" "$FILE"
    destructive: false
    source: https://jqlang.org/manual/
    verified: help

  - id: jq.top_values
    group: aggregate
    intents:
      - most common values of {FIELD} in {FILE}
      - count distinct countries and sort by frequency
      - frequency table of a json field
      - which values appear most often
    vars:
      - {name: FIELD, default: country, samples: [country, status, event_type]}
      - {name: FILE, default: data.json, samples: [orders.json, users.json], ctx: local_file}
    body: jq -r ".[].$FIELD" "$FILE" | sort | uniq -c | sort -rn | head
    destructive: false
    source: https://jqlang.org/manual/
    verified: help

  - id: jq.sort_latest
    group: transform
    intents:
      - show the 5 newest records by created_at
      - sort a json array by date descending and take the top few
      - latest entries first with jq
      - jq sort_by reverse limit
    vars:
      - {name: FILE, default: data.json, samples: [orders.json, runs.json], ctx: local_file}
    body: jq 'sort_by(.created_at) | reverse | .[:5]' "$FILE"
    destructive: false
    source: https://jqlang.org/manual/
    verified: help

  - id: jq.set_value
    group: transform
    intents:
      - set version to {VALUE} in {FILE} and write {OUT_FILE}
      - change one key in a json config with jq
      - update a json field value safely with --arg
      - bump the version in a json file
    vars:
      - {name: VALUE, default: "2.0", samples: ["1.4.0", "2026.03.15"]}
      - {name: FILE, default: config.json, samples: [config.json, package.json], ctx: local_file}
      - {name: OUT_FILE, default: config.new.json, samples: [config.new.json, package.tmp.json]}
    body: jq --arg v "$VALUE" '.version = $v' "$FILE" > "$OUT_FILE"
    destructive: false
    source: https://jqlang.org/manual/
    verified: help

  - id: jq.delete_key
    group: transform
    intents:
      - remove the password key from {FILE}
      - drop a field from a json object
      - jq del a key before sharing the config
      - strip a secret from json output
    vars:
      - {name: FILE, default: config.json, samples: [config.json, connection.json], ctx: local_file}
    body: jq 'del(.password)' "$FILE"
    destructive: false
    source: https://jqlang.org/manual/
    verified: help

  - id: jq.to_env
    group: convert
    intents:
      - turn a flat json object into KEY=value lines
      - convert {FILE} into env style pairs
      - json to dotenv format
      - print each key and value as key=value
    vars:
      - {name: FILE, default: config.json, samples: [settings.json, env.json], ctx: local_file}
    body: jq -r 'to_entries[] | "\(.key)=\(.value)"' "$FILE"
    destructive: false
    source: https://jqlang.org/manual/
    verified: help

  - id: jq.aws_bucket_names
    group: cli-output
    intents:
      - list just the s3 bucket names using aws cli and jq
      - parse aws s3api list-buckets json
      - bucket names only, one per line
      - aws output piped through jq
    body: aws s3api list-buckets --output json | jq -r '.Buckets[].Name'
    destructive: false
    source: https://jqlang.org/manual/
    verified: help

  - id: jq.kubectl_not_running
    group: cli-output
    intents:
      - names of pods that are not running using kubectl json and jq
      - parse kubectl get pods json to find unhealthy pods
      - jq over kubectl output
      - filter pod json by phase
    vars:
      - {name: NAMESPACE, default: default, samples: [airflow, spark-jobs], ctx: k8s_namespace}
    body: kubectl get pods -n "$NAMESPACE" -o json | jq -r '.items[] | select(.status.phase != "Running") | .metadata.name'
    destructive: false
    source: https://jqlang.org/manual/
    verified: help
