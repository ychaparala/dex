      - show my mwaa envs
      - aws mwaa list-environments
    vars: []
    body: aws mwaa list-environments
    destructive: false
    source: https://github.com/boto/botocore/tree/develop/botocore/data/mwaa
    verified: help

  - id: aws-data.mwaa.cli-token
    group: mwaa
    intents:
      - get an airflow cli token for mwaa environment {ENV_NAME}
      - create a cli token to run airflow commands on mwaa
      - mwaa create-cli-token
      - token and hostname for the mwaa airflow cli
    vars:
