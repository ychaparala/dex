- id: spark.standalone.submit
  group: standalone
  intents:
  - submit {APP_PY} to the standalone master {MASTER_URL} with {TOTAL_CORES} total cores
  - run on a spark standalone cluster
  - spark-submit to spark://
  - cap the total cores my job takes on standalone
  vars:
  - name: MASTER_URL
    default: spark://spark-master.example.com:7077
    samples: ['spark://10.0.0.5:7077', 'spark://localhost:7077']
  - name: TOTAL_CORES
    default: '16'
    samples: ['8', '32']
  - name: APP_PY
    default: app.py
    samples: [jobs/daily_orders.py, etl/load_events.py, main.py]
    ctx: local_file
  body: spark-submit --master "$MASTER_URL" --total-executor-cores "$TOTAL_CORES" "$APP_PY"
  destructive: false
  source: https://spark.apache.org/docs/latest/spark-standalone.html
  verified: docs
- id: spark.standalone.supervise
  group: standalone
  intents:
  - submit {JAR} to standalone cluster mode and restart the driver on failure
  - supervised spark driver on a standalone cluster
  - spark-submit --supervise
  - keep a streaming driver alive automatically
  vars:
  - name: MASTER_URL
    default: spark://spark-master.example.com:7077
    samples: ['spark://10.0.0.5:7077', 'spark://localhost:7077']
  - name: CLASS
    default: com.example.etl.Main
    samples: [com.example.OrdersJob, org.example.DailyAggregates]
  - name: JAR
    default: target/scala-2.13/etl-assembly-1.0.jar
    samples: [build/libs/orders-job-all.jar, jobs/spark-etl.jar]
    ctx: local_file
  body: spark-submit --master "$MASTER_URL" --deploy-mode cluster --supervise --class "$CLASS" "$JAR"
  destructive: false
  source: https://spark.apache.org/docs/latest/spark-standalone.html
  verified: docs
- id: spark.standalone.worker
  group: standalone
  intents:
  - start a spark standalone worker attached to {MASTER_URL}
  - run a spark worker in the foreground with spark-class
  - join this machine to a standalone spark master
