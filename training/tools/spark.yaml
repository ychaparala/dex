  body: spark-submit --status "$NAMESPACE:$DRIVER_POD" --master "$K8S_API"
  destructive: false
  source: https://spark.apache.org/docs/latest/running-on-kubernetes.html
  verified: docs
- id: spark.k8s.kill
  group: kubernetes
