  vars:
  - name: MASTER_URL
    default: spark://spark-master.example.com:7077
    samples: ['spark://10.0.0.5:7077', 'spark://localhost:7077']
  body: spark-class org.apache.spark.deploy.worker.Worker "$MASTER_URL"
  destructive: false
  source: https://spark.apache.org/docs/latest/spark-standalone.html
  verified: docs
- id: spark.sql.e
  group: sql
  intents:
  - run the query {QUERY} with spark-sql
  - execute a sql statement from the command line with spark
  - spark-sql -e
  - one-off spark sql query in the terminal
  vars:
  - name: QUERY
    default: SELECT count(*) FROM orders
    samples: [SHOW TABLES, SELECT * FROM events LIMIT 10, DESCRIBE TABLE sales]
  body: spark-sql -e "$QUERY"
  destructive: false
  source: https://github.com/apache/spark/blob/master/sql/hive-thriftserver/src/main/scala/org/apache/spark/sql/hive/thriftserver/SparkSQLCLIDriver.scala
  verified: help
- id: spark.sql.f_conf
  group: sql
  intents:
  - run the sql file {SQL_FILE} with spark-sql and {N} shuffle partitions
  - execute a spark sql script with custom conf
  - spark-sql -f with --conf
  - run a .sql file on spark
  vars:
  - name: N
    default: '200'
    samples: ['64', '400']
  - name: SQL_FILE
    default: transform.sql
    samples: [queries/daily_agg.sql, build_marts.sql]
    ctx: local_file
  body: spark-sql --conf spark.sql.shuffle.partitions="$N" -f "$SQL_FILE"
  destructive: false
  source: https://github.com/apache/spark/blob/master/sql/hive-thriftserver/src/main/scala/org/apache/spark/sql/hive/thriftserver/SparkSQLCLIDriver.scala
  verified: help
- id: spark.sql.hivevar
  group: sql
  intents:
  - run {SQL_FILE} with spark-sql setting run_date to {RUN_DATE}
  - pass a variable into a spark sql script
  - spark-sql hivevar substitution
  - parameterize a spark sql file with a date
  vars:
  - name: RUN_DATE
    default: '2026-11-25'
    samples: ['2026-01-01', '2026-06-30']
  - name: SQL_FILE
    default: daily.sql
    samples: [queries/backfill.sql]
    ctx: local_file
  body: spark-sql --hivevar run_date="$RUN_DATE" -f "$SQL_FILE"
  destructive: false
  source: https://github.com/apache/spark/blob/master/sql/hive-thriftserver/src/main/scala/org/apache/spark/sql/hive/thriftserver/SparkSQLCLIDriver.scala
  verified: help
- id: spark.sql.silent_head
  group: sql
  intents:
  - quietly run {QUERY} in spark-sql and show the first rows
  - spark-sql without log noise, just results
  - silent spark sql query piped to head
  - get only the output of a spark sql query
  vars:
  - name: QUERY
    default: SELECT * FROM orders
    samples: [SELECT * FROM events, SHOW DATABASES]
  body: spark-sql -S -e "$QUERY" | head -20
  destructive: false
  source: https://github.com/apache/spark/blob/master/sql/hive-thriftserver/src/main/scala/org/apache/spark/sql/hive/thriftserver/SparkSQLCLIDriver.scala
  verified: help
