- id: spark.k8s.submit
  group: kubernetes
  intents:
  - submit {APP} to kubernetes at {K8S_API} using image {IMAGE}
  - run spark on k8s in cluster mode
  - spark-submit to a kubernetes cluster
  - launch a spark driver pod
  vars:
  - name: K8S_API
    default: k8s://https://k8s-api.example.com:6443
    samples: ['k8s://https://10.0.0.1:443', 'k8s://https://127.0.0.1:6443']
  - name: IMAGE
    default: apache/spark:4.0.1
    samples: ['example.com/data/spark-py:1.4.0', 'registry.example.com/spark:4.0.1-python3']
  - name: APP
    default: local:///opt/spark/work-dir/app.py
    samples: ['local:///opt/app/jobs/etl.py', 's3a://my-bucket/jobs/main.py']
  body: spark-submit --master "$K8S_API" --deploy-mode cluster --name spark-job --conf spark.kubernetes.container.image="$IMAGE" "$APP"
  destructive: false
  source: https://spark.apache.org/docs/latest/running-on-kubernetes.html
  verified: docs
- id: spark.k8s.submit_ns
  group: kubernetes
  intents:
  - submit {APP} to kubernetes namespace {NAMESPACE} with service account spark
  - spark on k8s with namespace and driver service account
  - run spark job in a specific k8s namespace
  - k8s spark submit with rbac service account
  vars:
  - name: K8S_API
    default: k8s://https://k8s-api.example.com:6443
    samples: ['k8s://https://10.0.0.1:443', 'k8s://https://127.0.0.1:6443']
  - name: NAMESPACE
    default: spark
    samples: [data-eng, spark-jobs, default]
    ctx: k8s_namespace
  - name: IMAGE
    default: apache/spark:4.0.1
    samples: ['example.com/data/spark-py:1.4.0', 'registry.example.com/spark:4.0.1-python3']
  - name: APP
    default: local:///opt/spark/work-dir/app.py
    samples: ['local:///opt/app/jobs/etl.py']
  body: spark-submit --master "$K8S_API" --deploy-mode cluster --conf spark.kubernetes.namespace="$NAMESPACE" --conf spark.kubernetes.authenticate.driver.serviceAccountName=spark --conf spark.kubernetes.container.image="$IMAGE" "$APP"
  destructive: false
  source: https://spark.apache.org/docs/latest/running-on-kubernetes.html
  verified: docs
- id: spark.k8s.status
  group: kubernetes
  intents:
  - status of spark driver {DRIVER_POD} in {NAMESPACE}
  - check a spark on k8s submission
  - spark-submit --status on kubernetes
