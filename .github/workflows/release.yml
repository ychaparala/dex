name: release

# Pushing a tag like v0.1.0 builds dex-cli and publishes it to PyPI through trusted publishing,
# so no API token is stored in the repo.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: The tag matches both version strings
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -qx "version = \"$v\"" pyproject.toml
          grep -qx "__version__ = \"$v\"" src/dex/__init__.py
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv build
      - run: uv publish
